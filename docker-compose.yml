services:

  userdb:
    image: postgres:16
    container_name: userdb
    environment:
      POSTGRES_USER: ekko
      POSTGRES_PASSWORD: ekko
      POSTGRES_DB: userdb
    ports:
      - "5433:5432"

  authdb:
    image: postgres:16
    container_name: authdb
    environment:
      POSTGRES_USER: ekko
      POSTGRES_PASSWORD: ekko
      POSTGRES_DB: authdb
    ports:
      - "5435:5432"

  messagedb:
    image: postgres:16
    container_name: messagedb
    environment:
      POSTGRES_USER: ekko
      POSTGRES_PASSWORD: ekko
      POSTGRES_DB: messagedb
    ports:
      - "5434:5432"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"